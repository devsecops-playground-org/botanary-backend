# Shipped to /opt/botanary/backend by the platform's deploy-vm workflow.
name: botanary

services:
  backend:
    image: ${IMAGE}
    container_name: botanary-backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      APP_ENV: production
    ports:
      - "8080:8080"
    networks: [botanary_net]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  botanary_net:
    external: true
